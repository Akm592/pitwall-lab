name: Refresh FastF1 data

on:
  schedule:
    - cron: '17 0 * * *'
    - cron: '17 1-23 * * *'
    - cron: '47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'docs/**', 'README.md', 'design-qa.md']

permissions:
  contents: write

concurrency:
  group: production-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decide whether data needs checking
        id: plan
        if: github.event_name != 'push'
        env:
          DAILY: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0 * * *' }}
        run: |
          args=()
          if [ "$DAILY" = true ]; then args+=(--daily); fi
          python3 scripts/refresh_data.py --plan "${args[@]}"
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.due == 'true'
        with:
          python-version: '3.12'
      - name: Install data dependencies
        if: steps.plan.outputs.due == 'true'
        run: python -c 'import subprocess, sys, tomllib; subprocess.check_call([sys.executable, "-m", "pip", "install", *tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]])'
      - name: Refresh completed races
        id: import
        if: steps.plan.outputs.due == 'true'
        continue-on-error: true
        env:
          DAILY: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0 * * *' }}
        run: |
          args=()
          if [ "$DAILY" = true ]; then args+=(--daily); fi
          python scripts/refresh_data.py "${args[@]}"
      - name: Check refresh rules
        if: steps.plan.outputs.due == 'true'
        run: python scripts/check_refresh.py
      - name: Detect snapshot changes
        id: changes
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'push'
        with:
          node-version: '22'
          cache: npm
      - name: Validate frontend and data changes
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'push'
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit refreshed snapshots
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh completed FastF1 races'
          git push origin HEAD:main
      - name: Deploy updated production source
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo '::warning::Deployment inactive: configure VERCEL_DEPLOY_HOOK_URL in repository secrets.'
            echo 'Production deployment inactive: VERCEL_DEPLOY_HOOK_URL is missing.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl --fail --silent --show-error --retry 2 --max-time 60 --request POST "$VERCEL_DEPLOY_HOOK_URL" --output /tmp/vercel-deploy-response.json
          echo 'Vercel deployment requested. Check Vercel for build completion.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report unavailable upstream data
        if: always() && steps.import.outcome == 'failure'
        run: |
          echo '::error::Some source data was unavailable. Valid changes were retained; retry the workflow.'
          exit 1
